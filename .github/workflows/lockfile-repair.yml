name: Lockfile repair

# One-shot helper for PR #85. package.json gained @tanstack/react-table,
# @dnd-kit/core and @dnd-kit/sortable, and package-lock.json must be
# regenerated against the real npm registry — lockfile integrity hashes cannot
# be hand-written. This workflow runs `npm install` on the PR branch and
# commits the fully resolved result back, so the strict `npm ci` jobs in
# ci.yml (lint, typecheck, test, build) can pass.
#
# Self-guarding: it fires only when this file changes (the push that adds it)
# or on manual dispatch. The bot's lockfile commit touches only
# package-lock.json, which is outside this workflow's `paths` filter, so there
# is no trigger loop. Safe to delete after the PR merges.

on:
  workflow_dispatch:
  push:
    branches: [feat/reports-rework-pr-1]
    paths: [.github/workflows/lockfile-repair.yml]

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  repair:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reports-rework-pr-1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Regenerate lockfile
        run: npm install --no-audit --no-fund

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync; nothing to commit"
          else
            git add package-lock.json
            git commit -m "chore: regenerate package-lock.json"
            git push origin feat/reports-rework-pr-1
          fi
