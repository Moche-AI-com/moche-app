name: Finish Pricing V2 Billing

on:
  workflow_dispatch:
  push:
    branches:
      - feat/pricing-v2

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pricing-v2
          fetch-depth: 0
      - name: Add canonical V2 billing mappings and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          env_path = Path('lib/env.ts')
          env = env_path.read_text()
          old = """    starter_monthly: process.env.STRIPE_PRICE_STARTER_MONTHLY ?? '',
              starter_annual: process.env.STRIPE_PRICE_STARTER_ANNUAL ?? '',
              pro_monthly: process.env.STRIPE_PRICE_PRO_MONTHLY ?? '',
              pro_annual: process.env.STRIPE_PRICE_PRO_ANNUAL ?? '',"""
          new = """    starter_monthly:
              process.env.STRIPE_PRICE_V2_STARTER_MONTHLY ?? process.env.STRIPE_PRICE_STARTER_MONTHLY ?? '',
              starter_annual:
              process.env.STRIPE_PRICE_V2_STARTER_ANNUAL ?? process.env.STRIPE_PRICE_STARTER_ANNUAL ?? '',
              pro_monthly:
              process.env.STRIPE_PRICE_V2_PRO_MONTHLY ?? process.env.STRIPE_PRICE_PRO_MONTHLY ?? '',
              pro_annual:
              process.env.STRIPE_PRICE_V2_PRO_ANNUAL ?? process.env.STRIPE_PRICE_PRO_ANNUAL ?? '',
              portfolio_monthly: process.env.STRIPE_PRICE_V2_PORTFOLIO_MONTHLY ?? '',
              portfolio_annual: process.env.STRIPE_PRICE_V2_PORTFOLIO_ANNUAL ?? '',"""
          if old not in env:
              raise RuntimeError('Pricing environment anchor not found')
          env_path.write_text(env.replace(old, new, 1))

          example_path = Path('.env.example')
          example = example_path.read_text()
          if '# Pricing V2 canonical flat-rate prices' not in example:
              example += """

          # Pricing V2 canonical flat-rate prices. Set these before merging Pricing V2.
          # Legacy STRIPE_PRICE_STARTER_* and STRIPE_PRICE_PRO_* remain fallback-only for rollback.
          STRIPE_PRICE_V2_STARTER_MONTHLY=
          STRIPE_PRICE_V2_STARTER_ANNUAL=
          STRIPE_PRICE_V2_PRO_MONTHLY=
          STRIPE_PRICE_V2_PRO_ANNUAL=
          STRIPE_PRICE_V2_PORTFOLIO_MONTHLY=
          STRIPE_PRICE_V2_PORTFOLIO_ANNUAL=
          """
          example_path.write_text(example)

          Path('lib/billing/pricing-v2-price-map.test.ts').write_text("""import { describe, expect, it, vi } from 'vitest';

          const stripePrices = vi.hoisted(() => ({
            starter_monthly: 'price_starter_monthly_v2',
            starter_annual: 'price_starter_annual_v2',
            pro_monthly: 'price_pro_monthly_v2',
            pro_annual: 'price_pro_annual_v2',
            portfolio_monthly: 'price_portfolio_monthly_v2',
            portfolio_annual: 'price_portfolio_annual_v2',
          }));

          vi.mock('@/lib/env', () => ({ serverEnv: { stripePrices } }));

          import { planFromPriceId, priceIdFor } from './stripe';

          describe('Pricing V2 plan and price mapping', () => {
            const cases = [
              ['starter', 'monthly', 'price_starter_monthly_v2'],
              ['starter', 'annual', 'price_starter_annual_v2'],
              ['pro', 'monthly', 'price_pro_monthly_v2'],
              ['pro', 'annual', 'price_pro_annual_v2'],
              ['portfolio', 'monthly', 'price_portfolio_monthly_v2'],
              ['portfolio', 'annual', 'price_portfolio_annual_v2'],
            ] as const;

            it.each(cases)('maps %s %s in both directions', (plan, interval, price) => {
              expect(priceIdFor(plan, interval)).toBe(price);
              expect(planFromPriceId(price)).toBe(plan);
            });

            it('does not assign unknown or retired prices to a current plan', () => {
              expect(planFromPriceId('price_retired')).toBeNull();
              expect(planFromPriceId(null)).toBeNull();
            });
          });
          """)
          PY
          rm .github/workflows/finish-pricing-v2-billing.yml
          git diff --check
          git config user.name "Moche-AI Automation"
          git config user.email "noreply@moche-ai.com"
          git add -A
          git commit -m "fix: keep Pricing V2 billing mappings consistent"
          git push origin HEAD:feat/pricing-v2
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Build production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://example.com
          APP_URL: https://example.com
        run: npm run build
