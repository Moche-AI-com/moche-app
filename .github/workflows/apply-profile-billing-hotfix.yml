name: Apply Profile Billing Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - hotfix/profile-billing-pricing-v2

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/profile-billing-pricing-v2
          fetch-depth: 0
      - name: Restore validated files
        run: |
          cat scripts/billing-hotfix.part1 scripts/billing-hotfix.part2 scripts/billing-hotfix.part3 scripts/billing-hotfix.part4 | base64 --decode | tar --extract --gzip
          rm scripts/billing-hotfix.part1 scripts/billing-hotfix.part2 scripts/billing-hotfix.part3 scripts/billing-hotfix.part4
          rm .github/workflows/apply-profile-billing-hotfix.yml
          rm .github/workflows/fix-profile-billing-pricing-v2.yml 2>/dev/null || true
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Build production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://example.com
          APP_URL: https://example.com
        run: npm run build
      - name: Commit validated hotfix
        run: |
          git diff --check
          git config user.name "Moche-AI Automation"
          git config user.email "noreply@moche-ai.com"
          git add -A
          git commit -m "fix: align Profile billing with Pricing V2"
          git push origin HEAD:hotfix/profile-billing-pricing-v2
