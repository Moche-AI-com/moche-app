name: Fix Pricing V2 Portfolio Map

on:
  workflow_dispatch:
  push:
    branches:
      - feat/pricing-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pricing-v2
          fetch-depth: 0
      - name: Apply validated fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/env.ts')
          s = p.read_text()
          duplicate = "    portfolio_monthly: process.env.STRIPE_PRICE_V2_PORTFOLIO_MONTHLY ?? '',\n    portfolio_annual: process.env.STRIPE_PRICE_V2_PORTFOLIO_ANNUAL ?? '',\n"
          legacy = "    portfolio_monthly: process.env.STRIPE_PRICE_PORTFOLIO_MONTHLY ?? '',\n    portfolio_annual: process.env.STRIPE_PRICE_PORTFOLIO_ANNUAL ?? '',"
          canonical = "    portfolio_monthly:\n      process.env.STRIPE_PRICE_V2_PORTFOLIO_MONTHLY ?? process.env.STRIPE_PRICE_PORTFOLIO_MONTHLY ?? '',\n    portfolio_annual:\n      process.env.STRIPE_PRICE_V2_PORTFOLIO_ANNUAL ?? process.env.STRIPE_PRICE_PORTFOLIO_ANNUAL ?? '',"
          if duplicate not in s or legacy not in s:
              raise RuntimeError('Expected duplicate Portfolio mappings not found')
          p.write_text(s.replace(duplicate, '', 1).replace(legacy, canonical, 1))
          PY
          rm .github/workflows/fix-pricing-v2-portfolio-map.yml
          git diff --check
          git config user.name "Moche-AI Automation"
          git config user.email "noreply@moche-ai.com"
          git add -A
          git commit -m "fix: remove duplicate Pricing V2 portfolio mappings"
          git push origin HEAD:feat/pricing-v2
