name: Apply Pricing V2

on:
  push:
    branches:
      - feat/pricing-v2
    paths:
      - scripts/pricing-v2-transfer.part3

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pricing-v2
          fetch-depth: 0
      - name: Reconstruct validated transformation
        run: |
          cat scripts/pricing-v2-transfer.part1 scripts/pricing-v2-transfer.part2 scripts/pricing-v2-transfer.part3 | base64 --decode | gzip --decompress > /tmp/pricing_v2.py
          python3 /tmp/pricing_v2.py
          rm scripts/pricing-v2-transfer.part1 scripts/pricing-v2-transfer.part2 scripts/pricing-v2-transfer.part3
          rm .github/workflows/apply-pricing-v2.yml
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Build production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://example.com
          APP_URL: https://example.com
        run: npm run build
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "Moche-AI Automation"
          git config user.email "noreply@moche-ai.com"
          git add -A
          git commit -m "feat: launch Pricing V2 flat-rate plans"
          git push origin HEAD:feat/pricing-v2
