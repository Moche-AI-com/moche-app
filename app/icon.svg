<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Moche-AI">
  <!-- Favicon form of the DomeMark in components/Logo.tsx.
       A dark tile is baked in on purpose: the mark's teal->iris gradient is an
       accent range, and drawn on transparency it disappears against a light
       browser tab strip. The tile guarantees contrast in both tab themes. -->
  <defs>
    <linearGradient id="g" x1="6" y1="10" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33E6D4"/>
      <stop offset="1" stop-color="#7C8CFF"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="#070C14"/>
  <g transform="translate(24 25.5) scale(0.84) translate(-24 -24)">
    <path d="M5 34h38" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M8 34a16 16 0 0 1 32 0" stroke="url(#g)" stroke-width="2.4" fill="none"/>
    <path d="M13 34a11 11 0 0 1 22 0" stroke="url(#g)" stroke-width="2.4" opacity="0.5" fill="none"/>
    <path d="M20.5 34v-4.2a3.5 3.5 0 0 1 7 0V34" fill="#33E6D4" opacity="0.9"/>
    <circle cx="24" cy="12" r="2.4" fill="#FF8A5C"/>
    <path d="M24 12v-4" stroke="#FF8A5C" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
